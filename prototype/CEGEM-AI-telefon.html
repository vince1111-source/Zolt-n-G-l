<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12382a">
<title>CÉGEM.AI helyszíni nézet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================================
   CÉGEM.AI — telefon-első prototípus
   Helyszínen dolgozó kivitelezőnek: egy kéz, kesztyű, napfény, zaj.
   Nincs build, nincs függőség. Semmi nem kerül kiküldésre, semmi nem tárolódik.
   ========================================================================== */

:root{
  /* Meleg krém alap, fehér kártyák, mélyzöld márka, lime cselekvőszín —
     a szakember-szoftverek (Jobber, Tradify) vizuális nyelve. A napfény
     üzemmód továbbra is tiszta fekete-fehérre vált. */
  --ground:#f2f0e7;
  --surface:#ffffff;
  --surface-2:#e9e6d9;
  --surface-3:#fbfaf4;
  --line:#d8d3c2;
  --line-soft:#e5e1d2;
  --ink:#16241b;
  --ink-2:#45524a;
  --muted:#6c7569;
  --brand:#12382a;        /* fejléc és horgonyfelületek */
  --brand-ink:#ffffff;
  --brand-lagy:rgba(255,255,255,.28);
  --accent:#166b41;       /* kiemelt szöveg, linkek */
  --accent-ink:#ffffff;
  --accent-soft:#e0f0e0;
  --cta:#a5e838;          /* a cselekvés gombja — világít */
  --cta-ink:#0d2a16;
  --cta-udv:rgba(120,190,50,.4);
  --kritikus:#a32b17;
  --kritikus-soft:#fbe6e1;
  --rendben:#1f6b3f;
  --rendben-soft:#dff0e6;
  --figyelem:#8a5a00;
  --figyelem-soft:#f9edd6;
  --arnyek:0 1px 2px rgba(18,36,24,.05), 0 10px 26px rgba(18,36,24,.08);
  --dokk-arnyek:0 -2px 16px rgba(18,36,24,.10);
  --r:14px;
  --cel:56px;             /* legkisebb célfelület — kesztyűre méretezve */
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0e1512;
    --surface:#17211a;
    --surface-2:#1f2b22;
    --surface-3:#121a15;
    --line:#2d3b31;
    --line-soft:#233029;
    --ink:#eef2ea;
    --ink-2:#b7c3b6;
    --muted:#87938a;
    --brand:#0b1f16;
    --brand-ink:#eef2ea;
    --brand-lagy:rgba(238,242,234,.25);
    --accent:#8fdfa6;
    --accent-ink:#0d2a16;
    --accent-soft:#173324;
    --cta:#a5e838;
    --cta-ink:#0d2a16;
    --cta-udv:rgba(165,232,56,.35);
    --kritikus:#f08a72;
    --kritikus-soft:#331914;
    --rendben:#79c99a;
    --rendben-soft:#152b1f;
    --figyelem:#e0b45f;
    --figyelem-soft:#2e2512;
    --arnyek:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.35);
    --dokk-arnyek:0 -2px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1512;
  --surface:#17211a;
  --surface-2:#1f2b22;
  --surface-3:#121a15;
  --line:#2d3b31;
  --line-soft:#233029;
  --ink:#eef2ea;
  --ink-2:#b7c3b6;
  --muted:#87938a;
  --brand:#0b1f16;
  --brand-ink:#eef2ea;
  --brand-lagy:rgba(238,242,234,.25);
  --accent:#8fdfa6;
  --accent-ink:#0d2a16;
  --accent-soft:#173324;
  --cta:#a5e838;
  --cta-ink:#0d2a16;
  --cta-udv:rgba(165,232,56,.35);
  --kritikus:#f08a72;
  --kritikus-soft:#331914;
  --rendben:#79c99a;
  --rendben-soft:#152b1f;
  --figyelem:#e0b45f;
  --figyelem-soft:#2e2512;
  --arnyek:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.35);
  --dokk-arnyek:0 -2px 18px rgba(0,0,0,.5);
}

/* Napfény üzemmód: nem téma, hanem olvashatósági kapcsoló.
   Tiszta fekete-fehér, vastagabb betű, erősebb keret. */
:root[data-napfeny="1"]{
  --ground:#ffffff; --surface:#ffffff; --surface-2:#ffffff; --surface-3:#ffffff;
  --line:#14130f; --line-soft:#8d8a80;
  --ink:#000000; --ink-2:#14130f; --muted:#2e2c26;
  --brand:#ffffff; --brand-ink:#000000; --brand-lagy:#000000;
  --accent:#0f3d24; --accent-soft:#ffffff;
  --cta:#14130f; --cta-ink:#ffffff; --cta-udv:rgba(0,0,0,.3);
  --kritikus:#8c1d0a; --kritikus-soft:#ffffff;
  --rendben:#0f4d2a; --rendben-soft:#ffffff;
  --figyelem:#5c3b00; --figyelem-soft:#ffffff;
  --arnyek:none;
}
:root[data-napfeny="1"] .kartya,
:root[data-napfeny="1"] .sor,
:root[data-napfeny="1"] .chip{border-width:2px}
:root[data-napfeny="1"] .fejsav{border-bottom:2px solid #000}
:root[data-napfeny="1"] .fejsav .ikongomb{border-width:2px}
:root[data-napfeny="1"] body{font-weight:500}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- app-váz ---------- */
.app{
  max-width:460px; margin:0 auto; min-height:100dvh;
  display:grid; grid-template-rows:auto 1fr auto;
  /* minmax(0,1fr): enélkül a nem törhető tartalom (chipsáv) szétfeszíti a rácsot */
  grid-template-columns:minmax(0,1fr);
  background:var(--ground);
  border-left:1px solid var(--line-soft); border-right:1px solid var(--line-soft);
}
.app > *{min-width:0}
@media (max-width:460px){ .app{border:none} }

/* ---------- felső sáv ---------- */
.fejsav{
  position:sticky; top:0; z-index:20; background:var(--brand); color:var(--brand-ink);
  padding:calc(env(safe-area-inset-top) + .6rem) .9rem .6rem;
  display:flex; align-items:center; gap:.6rem;
}
.marka{font-weight:800; letter-spacing:-.02em; font-size:1.08rem; flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.marka span{color:var(--cta)}
.marka small{display:block; font-weight:500; font-size:.72rem; color:var(--brand-ink);
  opacity:.72; letter-spacing:0}
.ikongomb{
  min-width:44px; height:44px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); border-radius:12px; font-size:.72rem; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:.3rem; cursor:pointer;
  font-family:"IBM Plex Mono",monospace; letter-spacing:.03em; padding:0 .5rem;
}
/* A fejlécben ülő gombok a márkasávhoz öltöznek. */
.fejsav .ikongomb{background:transparent; border-color:var(--brand-lagy); color:var(--brand-ink)}
.ikongomb[aria-pressed="true"], .fejsav .ikongomb[aria-pressed="true"]{
  background:var(--cta); color:var(--cta-ink); border-color:var(--cta)}

.halozat{
  display:flex; align-items:center; gap:.35rem; font-family:"IBM Plex Mono",monospace;
  font-size:.68rem; color:var(--brand-ink); opacity:.85; letter-spacing:.04em;
}
.pont{width:8px; height:8px; border-radius:50%; background:var(--cta)}
.halozat.off .pont{background:var(--figyelem)}

/* ---------- AI Act jelzés (kötelező) ---------- */
.aisav{
  background:var(--surface-2); border-bottom:1px solid var(--line-soft);
  padding:.5rem .9rem; font-size:.78rem; color:var(--ink-2);
}
.aisav b{color:var(--ink); font-weight:600}

/* ---------- tartalom ---------- */
main{padding:1rem .9rem 1.2rem; display:flex; flex-direction:column; gap:.9rem; overflow-y:auto}
main > *{flex-shrink:0}
.cimsor{display:flex; align-items:baseline; justify-content:space-between; gap:.5rem}
h1{margin:0; font-size:1.6rem; font-weight:800; letter-spacing:-.03em; text-wrap:balance}
.datum{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--muted); white-space:nowrap}
.szekcio{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); margin:.5rem 0 -.25rem;
}

/* ---------- nagy állapotkártyák ---------- */
.kartya{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:.9rem 1rem; box-shadow:var(--arnyek); display:flex; flex-direction:column; gap:.15rem;
  text-align:left; width:100%; color:inherit; font:inherit; cursor:pointer;
}
.kartya.kritikus{border-left:4px solid var(--kritikus)}
.kartya.figyelem{border-left:4px solid var(--figyelem)}
.kartya.rendben{border-left:4px solid var(--rendben)}
.kartya .cimke{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted);
}
.kartya .ertek{
  font-size:2.05rem; font-weight:800; letter-spacing:-.035em; line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.kartya.kritikus .ertek{color:var(--kritikus)}
.kartya .alszoveg{font-size:.88rem; color:var(--ink-2)}

/* ---------- listasorok ---------- */
.sor{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:.75rem .9rem; display:flex; align-items:center; gap:.75rem;
  min-height:var(--cel); width:100%; text-align:left; color:inherit; font:inherit; cursor:pointer;
}
.sor .fo{flex:1; min-width:0}
.sor .nev{font-weight:600; font-size:.98rem}
.sor .alatta{font-size:.82rem; color:var(--muted)}
.sor .jobb{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.sor .osszeg{font-weight:600}
.jelzes{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.68rem;
  padding:.24em .6em; border-radius:999px; border:1px solid; letter-spacing:.03em; white-space:nowrap;
}
.j-kritikus{background:var(--kritikus-soft); color:var(--kritikus); border-color:var(--kritikus)}
.j-figyelem{background:var(--figyelem-soft); color:var(--figyelem); border-color:var(--figyelem)}
.j-rendben{background:var(--rendben-soft); color:var(--rendben); border-color:var(--rendben)}

/* ---------- asszisztens válasza ---------- */
.valasz{
  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--r);
  padding:.85rem 1rem; display:flex; flex-direction:column; gap:.6rem;
}
.hallottam{
  font-family:"IBM Plex Mono",monospace; font-size:.76rem; color:var(--muted);
  display:flex; gap:.4rem; align-items:flex-start;
}
.hallottam b{color:var(--ink-2); font-weight:500}
.valasz p{margin:0; font-size:1rem; line-height:1.45}
.valasz .kiemel{color:var(--accent); font-weight:600}
.reteg{
  align-self:flex-start; font-family:"IBM Plex Mono",monospace; font-size:.66rem;
  letter-spacing:.05em; padding:.22em .5em; border-radius:4px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--muted);
}
.reteg.ingyen{border-color:var(--rendben); color:var(--rendben); background:var(--rendben-soft)}
.reteg.varakozo{border-color:var(--figyelem); color:var(--figyelem); background:var(--figyelem-soft)}

/* ---------- gombok ---------- */
.gomb{
  min-height:var(--cel); border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; font-weight:700; font-size:1rem;
  padding:0 1.15rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.4rem;
  width:100%;
}
.gomb.fo{background:var(--cta); color:var(--cta-ink); border-color:var(--cta)}
.gomb.veszelyes{color:var(--kritikus); border-color:var(--kritikus)}
.gombsor{display:flex; flex-direction:column; gap:.5rem}
.gombsor.ketto{flex-direction:row}
.gombsor.ketto .gomb{flex:1}
button:focus-visible, a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.fejsav :focus-visible{outline-color:var(--cta)}

/* ---------- javaslatchipek ---------- */
.chipek{display:flex; gap:.5rem; overflow-x:auto; padding:.15rem .9rem .15rem;
  scrollbar-width:none; min-width:0}
.chipek::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  border-radius:999px; padding:.5rem .85rem; font-size:.85rem; font:inherit; font-size:.85rem;
  min-height:44px; cursor:pointer; white-space:nowrap;
}

/* ---------- alsó dokk ---------- */
.dokk{
  position:sticky; bottom:0; z-index:20; background:var(--ground); min-width:0;
  border-top:1px solid var(--line); box-shadow:var(--dokk-arnyek);
  padding:.6rem .9rem calc(env(safe-area-inset-bottom) + .7rem);
  display:flex; flex-direction:column; gap:.6rem;
}
.dokksor{display:flex; align-items:center; gap:.75rem}
.mikro{
  width:76px; height:76px; flex:0 0 76px; border-radius:50%;
  background:var(--cta); color:var(--cta-ink); border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 0 0 0 var(--cta-udv); position:relative;
}
.mikro svg{width:34px; height:34px}
.mikro[data-figyel="1"]{animation:lelegzik 1.4s ease-in-out infinite}
@keyframes lelegzik{
  0%,100%{box-shadow:0 0 0 0 var(--cta-udv)}
  50%{box-shadow:0 0 0 14px rgba(0,0,0,0)}
}
.mikrocimke{
  flex:1; min-width:0; font-size:.92rem; color:var(--ink-2); line-height:1.35;
}
.mikrocimke b{display:block; color:var(--ink); font-weight:600; font-size:1rem}
.tobbgomb{
  min-width:var(--cel); height:var(--cel); border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font:inherit; font-size:.78rem; font-weight:600;
  cursor:pointer; font-family:"IBM Plex Mono",monospace; letter-spacing:.04em; padding:0 .6rem;
}
.beviteli{display:flex; gap:.5rem}
.beviteli input{
  flex:1; min-height:48px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink); font:inherit; font-size:1rem; padding:0 .8rem;
}
.beviteli input::placeholder{color:var(--muted)}
.beviteli button{min-height:48px; width:auto; padding:0 1rem; flex:0 0 auto}

/* ---------- teljes képernyős lap (egy döntés) ---------- */
.lap{
  position:fixed; inset:0; z-index:40; background:var(--ground);
  display:flex; flex-direction:column; max-width:460px; margin:0 auto;
  animation:felcsuszik .18s ease-out;
}
@keyframes felcsuszik{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}
.lap-fej{
  padding:calc(env(safe-area-inset-top) + .7rem) .9rem .7rem;
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:.6rem;
}
.lap-fej h2{margin:0; font-size:1.1rem; font-weight:700; flex:1; letter-spacing:-.02em}
.lap-torzs{flex:1; overflow-y:auto; padding:1rem .9rem 1.2rem; display:flex; flex-direction:column; gap:.85rem}
.lap-torzs > *{flex-shrink:0}
.lap-lab{
  border-top:1px solid var(--line); padding:.7rem .9rem calc(env(safe-area-inset-bottom) + .8rem);
  display:flex; flex-direction:column; gap:.5rem; background:var(--ground);
}

/* ---------- feltételezés-sáv ---------- */
.feltetel{
  background:var(--figyelem-soft); border:1px solid var(--figyelem); border-radius:var(--r);
  padding:.85rem 1rem;
}
.feltetel .cim{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--figyelem); font-weight:600; margin-bottom:.4rem;
}
.feltetel ul{margin:0; padding-left:1.1rem; display:flex; flex-direction:column; gap:.35rem}
.feltetel li{font-size:.9rem; color:var(--ink-2)}
.feltetel li::marker{color:var(--figyelem)}

/* ---------- tételtáblázat ---------- */
.tetelek{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.tetel{
  display:grid; grid-template-columns:1fr auto; gap:.2rem .75rem;
  padding:.65rem .85rem; border-bottom:1px solid var(--line-soft); background:var(--surface);
}
.tetel:last-child{border-bottom:none}
.tetel .megnev{font-size:.92rem; font-weight:500}
.tetel .mennyi{font-size:.78rem; color:var(--muted); font-family:"IBM Plex Mono",monospace}
.tetel .ar{font-weight:600; font-variant-numeric:tabular-nums; align-self:center; white-space:nowrap}
.osszesen{
  display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
  padding:.85rem 1rem; background:var(--surface-2); border-top:1px solid var(--line);
}
.osszesen .c{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.osszesen .v{font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}

/* ---------- kiolvasott mezők (megerősítő folyamat) ---------- */
.mezok{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.mezo{
  display:flex; align-items:center; gap:.75rem; padding:.7rem .85rem;
  border-bottom:1px solid var(--line-soft); background:var(--surface);
  width:100%; text-align:left; font:inherit; color:inherit; min-height:var(--cel); cursor:pointer;
}
.mezo:last-child{border-bottom:none}
.mezo.ellenorizd{background:var(--figyelem-soft); border-left:4px solid var(--figyelem)}
.mezo .bal{flex:1; min-width:0; display:flex; flex-direction:column; gap:.1rem}
.mezo .nev{display:block;
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted);
}
.mezo .ert{display:block; font-weight:600; font-size:1rem; overflow-wrap:anywhere}
.mezo .honnan{display:block; font-size:.76rem; color:var(--muted)}
.mezo.ellenorizd .honnan{color:var(--figyelem)}
.mezo .ceruza{
  font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.05em;
  color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:.25em .5em; white-space:nowrap;
}

/* ---------- fotó ---------- */
.fotogomb{
  border:2px dashed var(--line); border-radius:var(--r); background:var(--surface-3);
  padding:2.2rem 1rem; display:flex; flex-direction:column; align-items:center; gap:.5rem;
  color:var(--ink-2); font:inherit; cursor:pointer; width:100%; min-height:180px;
  justify-content:center; text-align:center;
}
.fotogomb b{font-size:1.05rem; color:var(--ink)}
.fotogomb svg{width:40px; height:40px; color:var(--accent)}
.fotogomb input{display:none}

/* ---------- napló ---------- */
.naplotetel{
  border-left:3px solid var(--line); padding:.1rem 0 .1rem .8rem;
  display:flex; flex-direction:column; gap:.1rem;
}
.naplotetel .ido{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--muted)}
.naplotetel .mit{font-weight:600; font-size:.95rem}
.naplotetel .reszlet{font-size:.85rem; color:var(--ink-2)}
.naplotetel .bemenet{font-family:"IBM Plex Mono",monospace; font-size:.76rem; color:var(--muted)}

/* ---------- pirítós ---------- */
/* Semleges jelzés — a lezárt, már nem cselekvést igénylő állapotokhoz. */
.j-semleges{background:transparent; color:var(--muted); border-color:var(--line)}

/* --- A kiküldött dokumentum előnézete ---------------------------------- */
/* Szándékosan papírfehér mindkét témában: ez azt mutatja meg, amit az
   ügyfél kap kézhez, nem az alkalmazás felületét. */
.dok{
  background:#fff; color:#14161a; border:1px solid #d9dde3; border-radius:var(--r);
  padding:1rem .85rem; font-size:.8rem; line-height:1.45; overflow-x:auto;
}
.dok-fej{display:flex; gap:.75rem; justify-content:space-between; border-bottom:2px solid #14161a; padding-bottom:.7rem}
.dok-ceg{font-weight:700; font-size:1rem; letter-spacing:-.01em}
.dok-apro{font-size:.7rem; color:#5b6270; line-height:1.5; overflow-wrap:anywhere}
.dok-jobb{text-align:right; flex:0 0 auto}
.dok-tipus{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.16em;
  text-transform:uppercase; font-weight:600}
.dok-cimzett{margin:.8rem 0; padding:.6rem .7rem; background:#f4f6f9; border-radius:8px}
.dok-cimzett span{display:block; font-family:"IBM Plex Mono",monospace; font-size:.64rem;

  { id:"lejart",      re:/(lejart|kintlevo|kinnlevo|ki tartozik|nem fizettek|hatralek)/ },
  { id:"fizetendo",   re:/(mennyit kell kifizet|mit kell utalni|utalni|bejovo szaml|kinek tartozom)/ },
  { id:"teendo",      re:/(mai teendo|mi a dolgom|teendoim|mi van ma|mai feladat|napirend|mit kell ma)/ },
  { id:"osszefoglalo",re:/(helyzet a cegemben|hogy allunk|foglald ossze|osszefoglal|hogy all a ceg)/ },
  // A „helyszín" szót szándékosan nem tesszük bele: a „mennyibe kerül a
  // helyszíni felmérés?" az árlistához tartozik, nem a munkákhoz.
  { id:"munkak",      re:/(munkaim|munkak|hogy all a munka|hogy allnak a munka|melyik munkan|epitkezes)/ },
  { id:"nagyker",     re:/(nagyker|beszerzesi ar|szallitoi ar|arres|mennyiert adja|arfrissites|mennyiert veszem)/ },
  { id:"arlista",     re:/(arlista|mennyibe kerul|mi az ara|listaar|mennyiert adom)/ },
];

function reteg0(szoveg){
  const t = norm(szoveg);
  if(!t.trim()) return null;
  const adatok = {};
  const p = partnerKinyeres(szoveg); if(p) adatok.partner = p;
  const m = szamKinyeres(szoveg);    if(m) adatok.mennyiseg = m;
  const h = hataridoKinyeres(szoveg);if(h) adatok.hatarido = h;
  for(const sz of SZANDEKOK){
    if(!sz.re.test(t)) continue;
    if(sz.csakHa && !sz.csakHa(adatok)) continue;
    const hianyzik = (sz.kell || []).filter(k => !adatok[k]);
    return { szandek:sz.id, adatok, hianyzik };
  }
  return null;
}

/* ==========================================================================
   Ajánlatkalkuláció — determinisztikus kód. A modell nem számol.
   ========================================================================== */
/* Az árlistatétel név szerint keresendő, nem index szerint: a lista
   szerkeszthető, és egy törlés nem boríthatja fel a többi tétel árazását.
   Ha a tétel hiányzik, a hiba néven nevezi — a rendszer nem talál ki árat. */
function arTetel(nev){
  const t = arlista.find(x => x.nev === nev);
  if(!t) throw new Error(`Az árlistából hiányzik: „${nev}". Vedd fel újra az Árlistában, és próbáld újra.`);
  return t;
}

function ajanlatKeszites(partnerId, m2, valtozat = "normal"){
  const p = P(partnerId);
  const fm = Math.round(4 * Math.sqrt(m2) / 5) * 5;
  const anyag = arTetel(valtozat === "antik" ? "Térkő anyag, antik 6 cm" : "Térkő anyag, szürke 6 cm");
  const alap  = arTetel("Alapozás, zúzottkő ágyazat");
  const munka = arTetel("Térkő lerakás, normál kötés");
  const szegA = arTetel("Szegélykő, süttői 100×20");
  const szegM = arTetel("Szegélykő elhelyezés");
  const kisz  = arTetel("Kiszállás, munkakezdés");
  const tetelek = [
    { nev:alap.nev,  mennyi:m2, egyseg:"m²", ar:alap.ar },
    { nev:anyag.nev, mennyi:Math.round(m2 * 1.05), egyseg:"m²", ar:anyag.ar },
    { nev:munka.nev, mennyi:m2, egyseg:"m²", ar:munka.ar },
    { nev:szegA.nev, mennyi:fm, egyseg:"fm", ar:szegA.ar },
    { nev:szegM.nev, mennyi:fm, egyseg:"fm", ar:szegM.ar },
    { nev:kisz.nev,  mennyi:1,  egyseg:"alk", ar:kisz.ar },
  ];
  const listaar = tetelek.reduce((s,t) => s + t.mennyi * t.ar, 0);
  const netto = listaar * (1 - p.kedvezmeny / 100);
  // Fedezet: mennyi marad, ha a beszerzést (nagyker + önköltség) kifizettük.
  // Ugyanabból a tételsorból számol, mint az összeg — nem külön becslés.
  const onkoltseg = tetelek.reduce((s,t) => {
    const at = arlista.find(x => x.nev === t.nev);
    return s + t.mennyi * ((at && at.besz != null) ? at.besz : t.ar);
  }, 0);
  const fedezet = netto - onkoltseg;
  return { partner:p, m2, fm, valtozat, tetelek, listaar, kedvezmenyErtek:listaar - netto,
           netto, afa:netto * (ceg.afa / 100), brutto:netto * (1 + ceg.afa / 100),
           onkoltseg, fedezet, fedezetSzazalek: netto > 0 ? fedezet / netto * 100 : 0 };
}

/* ==========================================================================
   Anyagszükséglet — szintén determinisztikus, és ugyanabból a méretből
   számol, mint az ajánlat. Ha ezt a modell találná ki, rossz mennyiség
   érkezne a telepre — az pedig pénzbe és egy napba kerül.
   ========================================================================== */
const ANYAG = {
  agyazatVastagsag:0.15,    // m, tömörítve
  tomoritesiSzorzo:1.25,    // laza térfogat / tömörített
  zuzottkoSuruseg:1.7,      // t/m³
  homokVastagsag:0.04,      // m ágyazóréteg
  homokSuruseg:1.6,         // t/m³
  raklapM2:12.96,           // egy raklap szürke 6 cm-es térkő
  fugahomokKgM2:2,
  zsakKg:25,
};
const egyTized = n => Math.round(n * 10) / 10;

function anyagszukseglet(m2, fm, valtozat){
  const terkoM2 = Math.round(m2 * 1.05);
  const zuzottkoM3 = m2 * ANYAG.agyazatVastagsag * ANYAG.tomoritesiSzorzo;
  const homokM3 = m2 * ANYAG.homokVastagsag;
  return [
    { nev: valtozat === "antik" ? "Térkő, antik 6 cm" : "Térkő, szürke 6 cm",
      mennyi:terkoM2, egyseg:"m²",
      nagykerNev: valtozat === "antik" ? "Térkő anyag, antik 6 cm" : "Térkő anyag, szürke 6 cm",
      alatta:`${Math.ceil(terkoM2 / ANYAG.raklapM2)} raklap · 5% vágási ráhagyással` },
    { nev:"Zúzottkő 0/32 — alapréteg", mennyi:egyTized(zuzottkoM3 * ANYAG.zuzottkoSuruseg), egyseg:"t",
      nagykerNev:"Zúzottkő 0/32",
      alatta:`${Math.round(ANYAG.agyazatVastagsag * 100)} cm tömörítve · ${egyTized(zuzottkoM3)} m³ lazán` },
    { nev:"Ágyazóhomok 0/4", mennyi:egyTized(homokM3 * ANYAG.homokSuruseg), egyseg:"t",
      nagykerNev:"Ágyazóhomok 0/4",
      alatta:`${Math.round(ANYAG.homokVastagsag * 100)} cm ágyazóréteg` },
    { nev:"Szegélykő, süttői 100×20", mennyi:fm, egyseg:"db",
      nagykerNev:"Szegélykő, süttői 100×20",
      alatta:"1 fm-es elemek, a becsült kerületre" },
    { nev:"Beton a szegélygerendához", mennyi:egyTized(fm * 0.02), egyseg:"m³",
      nagykerNev:"C12/15 beton",
      alatta:"C12/15, kétoldali megtámasztással" },
    { nev:"Fugahomok", mennyi:Math.ceil(m2 * ANYAG.fugahomokKgM2 / ANYAG.zsakKg), egyseg:"zsák",
      nagykerNev:"Fugahomok 25 kg",
      alatta:`${ANYAG.zsakKg} kg-os kiszerelés` },
  ];
}

/* A beszerzési lista ára a nagyker aktuális árain. */
function beszerzesiKoltseg(lista){
  let ossz = 0, hianyzo = 0;
  for(const t of lista){
    const nk = nagyker.tetelek.find(x => x.nev === t.nagykerNev);
    if(nk) ossz += t.mennyi * nk.besz; else hianyzo += 1;
  }
  return { ossz, hianyzo };
}

/* ==========================================================================
   13. modul — a kiadott ajánlatok. Ami kiment, annak van sorsa: elfogadták,
   elutasították, vagy hallgatnak rá. A harmadik a legfontosabb: abból lesz
   utánkövetési feladat.
   ========================================================================== */
let ajanlatSzamlalo = 31;
const kovetkezoAjanlatSzam = () => `AJ-2026/0${ajanlatSzamlalo + 1}`;

/* A díjbekérő és a számla is folyamatos sorszámot kap — két elfogadott
   ajánlat nem kaphatja ugyanazt. A számlasorozat a meglévőt folytatja. */
let dijbekeroSzamlalo = 106;
let szamlaSzamlalo = 151;

/* A kiadott ajánlat a KIADÁSKORI árak pillanatképét hordozza — az árlista
   későbbi módosítása nem írhatja át, amit az ügyfél kézhez kapott.
   (Ugyanez a szabály van a mag/arkalkulacio.mjs-ben és a db sémában is.) */
let ajanlatok = [
  { szam:"AJ-2026/031", partner:"szabo", m2:260, valtozat:"normal", kelt:"2026-08-16", allapot:"nincs válasz" },
  { szam:"AJ-2026/029", partner:"nagy",  m2:180, valtozat:"antik",  kelt:"2026-08-11", allapot:"elfogadva" },
  { szam:"AJ-2026/027", partner:"zold",  m2:340, valtozat:"normal", kelt:"2026-08-04", allapot:"elutasítva" },
].map(a => {
  const kep = ajanlatKeszites(a.partner, a.m2, a.valtozat);
  // lanc: az elfogadott ajánlat útja a pénzig — díjbekérő, majd számla.
  return { ...a, brutto: kep.brutto, pillanatkep: kep, lanc: null };
});

      // A most készített fotó blob-URL-je újratöltés után halott. Inkább ne
      // maradjon vissza üres csempe „bizonyítékként": a demóban a kamerából

/* const tömböt nem lehet újraértékelni, a tartalmát viszont ki lehet cserélni. */
const csere = (tomb, uj) => { if(Array.isArray(uj)) tomb.splice(0, tomb.length, ...uj); };

function betolt(){
  let x = null;
  try{ x = JSON.parse(localStorage.getItem(TAROLO) || "null"); }catch(_){ return; }
  if(!x || typeof x !== "object") return;
  try{
    if(x.ceg) Object.assign(ceg, x.ceg);
    csere(partnerek, x.partnerek); csere(arlista, x.arlista);
    csere(szamlak, x.szamlak);     csere(feladatok, x.feladatok);
    if(Array.isArray(x.bejovoSzamlak)) bejovoSzamlak = x.bejovoSzamlak;
    if(Array.isArray(x.ajanlatok)) ajanlatok = x.ajanlatok;
    if(Array.isArray(x.naplo)) naplo = x.naplo;
    if(Number.isFinite(x.ajanlatSzamlalo)) ajanlatSzamlalo = x.ajanlatSzamlalo;
    if(Number.isFinite(x.dijbekeroSzamlalo)) dijbekeroSzamlalo = x.dijbekeroSzamlalo;
    if(Number.isFinite(x.szamlaSzamlalo)) szamlaSzamlalo = x.szamlaSzamlalo;
    if(Array.isArray(x.sor)) sor = x.sor;
    if(x.nagyker && Array.isArray(x.nagyker.tetelek)) nagyker = x.nagyker;
    if(Array.isArray(x.munkak)) munkak = x.munkak;
    if("arfrissites" in x) arfrissites =
      (x.arfrissites && Array.isArray(x.arfrissites.valtozasok)) ? x.arfrissites : null;
  }catch(_){ /* sérült tárolt állapot — inkább a mintaadat, mint egy törött demó */ }
}

function munkaLap(id){
  const m = munkak.find(x => x.id === id);
  if(!m) return;
  const idx = MUNKA_ALLAPOTOK.indexOf(m.allapot);
  const kovetkezo = MUNKA_ALLAPOTOK[idx + 1];
  const elozo = MUNKA_ALLAPOTOK[idx - 1];
  const aj = m.ajanlat ? ajanlatok.find(x => x.szam === m.ajanlat) : null;
  const el = lapNyit(`
    <div class="lap-fej">
      <button class="ikongomb" data-zar aria-label="Vissza">←</button>
      <h2>${esc(m.nev)}</h2>
      <span class="jelzes ${MUNKA_JELZES[m.allapot]}">${esc(m.allapot)}</span>
    </div>
    <div class="lap-torzs">
      <div class="sor" style="cursor:default">
        <div class="fo">
          <div class="nev">${esc(P(m.partner).nev)}</div>
          <div class="alatta">${esc(m.helyszin)} · ${new Intl.NumberFormat("hu-HU").format(m.m2)} m² · határidő ${datumHu(m.hatarido)}</div>
        </div>
      </div>
      ${aj ? `
      <button class="sor" data-ajanlat-nyit="${aj.szam}">
        <div class="fo"><div class="nev">Ajánlat: ${aj.szam}</div>
        <div class="alatta">${Ft(aj.brutto)} · ${esc(aj.allapot)}</div></div>
        <span class="jelzes ${AJANLAT_JELZES[aj.allapot] || "j-semleges"}">${esc(aj.allapot)}</span>
      </button>` : ""}
      <div class="szekcio">Fotódokumentáció</div>
      <div class="fotoracs">
        ${m.fotok.map(fotoHtml).join("")}
        <label class="fotoplusz">
          <b>+</b> Fotó
          <input type="file" accept="image/*" capture="environment" id="munkaFoto">
        </label>
      </div>
      <p style="margin:0; font-size:.82rem; color:var(--muted)">
        A fotó a munkához kötve, dátummal kerül el — vitás helyzetben ez a
        bizonyíték. A demóban a most készített kép a munkamenet végéig marad meg.
      </p>
    </div>
    <div class="lap-lab">
      ${kovetkezo ? `<button class="gomb fo" data-tett="munka-allapot:${m.id}">Állapot: ${esc(m.allapot)} → ${esc(kovetkezo)}</button>` : ""}
      <div class="gombsor ${elozo ? "ketto" : ""}">
        ${elozo ? `<button class="gomb" data-tett="munka-vissza:${m.id}">← ${esc(elozo)}</button>` : ""}
        <button class="gomb" data-zar>Vissza</button>
      </div>
    </div>`);
  el.querySelector("[data-ajanlat-nyit]")?.addEventListener("click", ev =>
    ajanlatMegnyit(ev.currentTarget.dataset.ajanlatNyit));
  const be = el.querySelector("#munkaFoto");
  if(be) be.addEventListener("change", () => {
    const f = be.files && be.files[0];
    if(!f) return;
    // Valódi óraidő: két egymás utáni fotó nem kaphat azonos címkét, és a
    // lap azt ígéri, hogy a fotó dátummal kerül el.
    const most = new Date();
    const ido = String(most.getHours()).padStart(2, "0") + ":" + String(most.getMinutes()).padStart(2, "0");
    const url = URL.createObjectURL(f);
    blobUrlok.push(url);
    m.fotok.push({ cimke:`ma · ${ido}`, url });
    naplo.unshift({ ido, mit:"Fotó a munkához",
      reszlet:`${m.nev} · ${m.fotok.length}. fotó, dátummal rögzítve`, allapot:"kész" });
    ment(); rajzol(); munkaLap(m.id); pirit("Fotó rögzítve");
  });
}

/* Az árfrissítés átnézése — egy képernyő, egy döntés. A rendszer megmutatja,
   mi drágult és mit jelentene az árrés tartása; az átvezetés a te döntésed. */
function arfrissitesLap(){
  if(!arfrissites) return;
  // A 2. sarkalatos szabály: a javaslatnak is legyen nyoma, ne csak a
  // döntésnek. Egyszer naplózzuk, nem minden megnyitáskor.
  if(!arfrissites.naplozva){
    arfrissites.naplozva = true;
    naplo.unshift({ ido:"08:27", mit:"Nagyker árfrissítés kiszámolva",
      reszlet:`${P(nagyker.szallito).nev} · ${arfrissites.valtozasok.length} tétel · új eladási árak az árrés tartásával — jóváhagyásra vár`,
      allapot:"jóváhagyásra vár" });
    ment();
  }
  const hu = new Intl.NumberFormat("hu-HU");
  const sorok = arfrissites.valtozasok.map(v => {
    const nk = nagyker.tetelek.find(x => x.nev === v.nev);
    if(!nk) return null; // ismeretlen tétel a frissítésben — kihagyjuk, nem dobunk hibát
    const sajat = arlista.find(x => x.nev === v.nev);
    const szazalek = Math.round((v.uj - nk.besz) / nk.besz * 100);
    // Új eladási ár csak akkor számolható, ha van mihez tartani az árrést.
    const ujElado = (sajat && sajat.besz > 0)
      ? Math.round(v.uj * sajat.ar / sajat.besz / 10) * 10 : null;
    return { v, nk, sajat, szazalek, ujElado };
  }).filter(Boolean);
  lapNyit(`
    <div class="lap-fej">
      <button class="ikongomb" data-zar aria-label="Vissza">←</button>
      <h2>Árfrissítés — ${esc(P(nagyker.szallito).nev)}</h2>
    </div>
    <div class="lap-torzs">
      <div class="feltetel">
        <div class="cim">Mit jelent ez neked</div>
        <ul>
          <li>${sorok.filter(x => x.v.uj > x.nk.besz).length} tétel drágult, ${sorok.filter(x => x.v.uj < x.nk.besz).length} olcsóbb lett.</li>
          <li>Ahol a tétel az árlistádban is szerepel, kiszámoltam az új eladási árat
              <b>az árrésed tartásával</b>, 10 Ft-ra kerekítve.</li>
          <li>Amíg nem hagyod jóvá, minden ajánlat a régi árakkal készül.</li>
        </ul>
      </div>
      <div class="tetelek">
        ${sorok.map(({v, nk, szazalek, ujElado, sajat}) => `
          <div class="tetel">
            <div><div class="megnev">${esc(v.nev)}</div>
            <div class="mennyi">${hu.format(nk.besz)} → ${hu.format(v.uj)} Ft/${esc(nk.egyseg)} (${szazalek > 0 ? "+" : ""}${szazalek}%)</div></div>
            <div class="ar">${ujElado != null ? `eladási ${hu.format(sajat.ar)} → ${hu.format(ujElado)} Ft`
              : sajat ? "nincs beszerzési ár rögzítve" : "csak beszerzés"}</div>
          </div>`).join("")}
      </div>
      <p style="margin:0; font-size:.85rem; color:var(--muted)">
        Az átvezetés a kiadott ajánlatokat nem érinti — azok a kiadáskori
        árak pillanatképét őrzik.
      </p>
    </div>
    <div class="lap-lab">
      <button class="gomb fo" data-tett="arfrissites-atvezet">Átvezetem — az árrésem marad</button>
      <div class="gombsor ketto">
        <button class="gomb" data-tett="arfrissites-csakbesz">Csak a beszerzési árat</button>
        <button class="gomb" data-zar>Később</button>
      </div>
    </div>`);
}

/* ==========================================================================
   Teljes képernyős lapok — egy képernyő, egy döntés
   ========================================================================== */
function lapNyit(html){
  lapZar();
  const el = document.createElement("div");
  el.className = "lap";
  el.id = "lap";
  el.innerHTML = html;
  document.body.appendChild(el);
  el.querySelectorAll("[data-zar]").forEach(b => b.addEventListener("click", lapZar));
  el.querySelectorAll("[data-tett]").forEach(b => b.addEventListener("click", () => tett(b.dataset.tett)));
  return el;
}
function lapZar(){ const el = document.getElementById("lap"); if(el) el.remove(); }

/* Egy képernyő, egy döntés — szerkesztésre is. Egyetlen űrlaplap szolgálja ki
   az árlistát, a partnereket és a kiolvasott mezők javítását. */
function urlapLap({ cim, leiras, mezok, mentesCimke, onMentes, torles, megse }){
  const el = lapNyit(`
    <div class="lap-fej"><button class="ikongomb" data-zar aria-label="Vissza">←</button><h2>${esc(cim)}</h2></div>
    <div class="lap-torzs">
      ${leiras ? `<p class="urlap-sugo">${leiras}</p>` : ""}
      <div class="urlap">
        ${mezok.map(m => `
          <label class="urlap-mezo">
            <span>${esc(m.nev)}</span>
            <input name="${m.kulcs}" type="${m.tipus || "text"}"
                   ${m.tipus === "number" ? 'inputmode="numeric" min="0" step="1"' : ""}
                   value="${esc(m.ertek === undefined || m.ertek === null ? "" : m.ertek)}"
                   placeholder="${esc(m.tipp || "")}">
          </label>`).join("")}
      </div>
    </div>
    <div class="lap-lab">
      <button class="gomb fo" data-ment>${esc(mentesCimke || "Mentés")}</button>
      <div class="gombsor ketto">
        <button class="gomb" data-zar>Mégsem</button>
        ${torles ? '<button class="gomb veszelyes" data-torol>Törlöm</button>' : ""}
      </div>
    </div>`);
  const beolvas = () => {
    const ki = {};
    el.querySelectorAll(".urlap input").forEach(i => {
      ki[i.name] = i.type === "number" ? Number(i.value) : i.value.trim();
    });
    return ki;
  };
  el.querySelector("[data-ment]").addEventListener("click", () => onMentes(beolvas()));
  el.querySelector("[data-torol]")?.addEventListener("click", () => torles());
  // Ha van hova visszalépni (pl. az Ellenőrizd lap), a Mégsem oda vigyen,
  // ne a főképernyőre dobja ki a felhasználót a folyamat közepéről.
  if(megse) el.querySelectorAll("[data-zar]").forEach(b =>
    b.addEventListener("click", () => megse()));
  el.querySelectorAll(".urlap input").forEach(i =>
    i.addEventListener("keydown", e => { if(e.key === "Enter") onMentes(beolvas()); }));
  setTimeout(() => el.querySelector(".urlap input")?.focus(), 80);
  return el;
}

/* --- Árlista szerkesztése. Ez nem díszlet: az ajánlat innen számol, tehát
   egy áremelés után a következő ajánlat már az új árral megy ki. --------- */
function arlistaSzerkeszt(i){
  const uj = i < 0;
  const t = uj ? { nev:"", egyseg:"m²", ar:0 } : arlista[i];
  urlapLap({
    cim: uj ? "Új árlistatétel" : "Ár módosítása",
    leiras: uj ? "Vedd fel a saját tételedet. Ha beszerzési árat is adsz, számoljuk az árrést." :
      "Az ajánlat ebből az árlistából számol — amit itt átírsz, a következő ajánlatban már így megy ki."
      + (t.nagyker ? " A beszerzési árat a nagyker árfrissítése is frissíti." : ""),
    mezok: [
      { kulcs:"nev", nev:"Megnevezés", ertek:t.nev, tipp:"pl. Térkő lerakás, normál kötés" },
      { kulcs:"egyseg", nev:"Mennyiségi egység", ertek:t.egyseg, tipp:"m², fm, db, alk." },
      { kulcs:"ar", nev:"Nettó eladási ár (Ft)", ertek:t.ar, tipus:"number" },
      { kulcs:"besz", nev:"Beszerzési ár / önköltség (Ft)", ertek:t.besz ?? "", tipus:"number",
        tipp:"üresen hagyható" },
    ],
    mentesCimke: uj ? "Felveszem" : "Mentem az új árat",
    torles: uj ? null : () => {
      naplo.unshift({ ido:"08:40", mit:"Árlistatétel törlése", reszlet:esc(t.nev), allapot:"kész" });
      arlista.splice(i, 1); ment(); lapZar(); rajzol(); pirit("Tétel törölve");
    },
    onMentes: (k) => {
      if(!k.nev || !(k.ar >= 0)){ pirit("Név és ár kell hozzá"); return; }
      const regi = t.ar;
      const besz = k.besz > 0 ? k.besz : (k.besz === 0 ? 0 : undefined);
      // A nagyker-kapcsolat a néven múlik: ha a név már nem egyezik a
      // szállító tételével, a jelölést levesszük — ha egyezik, felvesszük,
      // és a beszerzési ár a szállítóét követi.
      const nkTetel = nagyker.tetelek.find(x => x.nev === k.nev);
      const adat = { nev:k.nev, egyseg:k.egyseg || t.egyseg || "db", ar:k.ar,
        besz: nkTetel ? nkTetel.besz : besz, nagyker: !!nkTetel };
      if(uj) arlista.push(adat);
      else Object.assign(arlista[i], adat);
      naplo.unshift({ ido:"08:40", mit: uj ? "Új árlistatétel" : "Ár módosítása",
        reszlet: uj ? `${k.nev} · ${Ft(k.ar)}/${adat.egyseg}` : `${k.nev} · ${Ft(regi)} → ${Ft(k.ar)}`,
        allapot:"kész" });
      ment(); lapZar(); nezet = "arlista"; rajzol();
      if(adat.besz != null && k.ar < adat.besz){
        pirit("Figyelem: az eladási ár a beszerzési ár alatt van");
      } else {
        pirit(uj ? "Tétel felvéve" : "Új ár mentve");
      }
    },
  });
}

/* --- Partner felvétele és szerkesztése. A felvett partnert a 0. réteg
   felismerője is megtalálja, tehát utána már ki lehet mondani a nevét. --- */
function partnerSzerkeszt(id){
  const uj = !id;
  const p = uj ? { nev:"", kapcsolat:"", kedvezmeny:0 } : P(id);
  urlapLap({
    cim: uj ? "Új partner" : "Partner szerkesztése",
    leiras: "A törzsvevői kedvezmény automatikusan beépül minden neki készülő ajánlatba.",
    mezok: [
      { kulcs:"nev", nev:"Név", ertek:p.nev, tipp:"pl. Kovács Építő Kft." },
      { kulcs:"kapcsolat", nev:"Kapcsolattartó", ertek:p.kapcsolat, tipp:"pl. Kovács Péter" },
      { kulcs:"kedvezmeny", nev:"Törzsvevői kedvezmény (%)", ertek:p.kedvezmeny || 0, tipus:"number" },
    ],
    mentesCimke: uj ? "Felveszem" : "Mentem",
    onMentes: (k) => {
      if(!k.nev){ pirit("A név kötelező"); return; }
      const kedv = Math.min(Math.max(k.kedvezmeny || 0, 0), 99);
      if(uj){
        const ujId = "p" + Date.now().toString(36);
        partnerek.push({ id:ujId, nev:k.nev, kapcsolat:k.kapcsolat || "—", kedvezmeny:kedv });
        naplo.unshift({ ido:"08:42", mit:"Új partner", reszlet:k.nev, allapot:"kész" });
        ment(); lapZar(); nezet = "partner:" + ujId; rajzol(); pirit("Partner felvéve");
      } else {
        Object.assign(p, { nev:k.nev, kapcsolat:k.kapcsolat || "—", kedvezmeny:kedv });
        naplo.unshift({ ido:"08:42", mit:"Partner módosítása", reszlet:k.nev, allapot:"kész" });
        ment(); lapZar(); rajzol(); pirit("Mentve");
      }
    },
  });
}

/* ==========================================================================
   Az ajánlat útja a pénzig: ajánlat → díjbekérő → számla. A díjbekérőt és
   a számlát NEM mi állítjuk ki, hanem a számlázó (Billingo API v3:
   proforma, majd create-from-proforma) — a demóban a hívás szimulált,
   a jóváhagyási kapu viszont éles. Csak elfogadott ajánlatból indulhat.
   ========================================================================== */
function lancHtml(szam, allapot){
  const rec = ajanlatok.find(x => x.szam === szam);
  if(!rec || allapot !== "elfogadva") return "";
  const l = rec.lanc || {};
  const lepes = (kesz, aktiv, nev, mi) => `
    <div class="lepes ${kesz ? "kesz" : aktiv ? "aktiv" : ""}">
      <span class="pont2"></span>
      <span class="lnev">${nev}</span>
      <span class="lmi">${mi}</span>
    </div>`;
  return `
    <div class="szekcio">Az ajánlat útja a pénzig</div>
    <div class="lanc">
      ${lepes(true, false, "Ajánlat elfogadva", esc(rec.szam))}
      ${lepes(!!l.dijbekero && l.dijbekero.allapot !== "küldésre vár", !l.dijbekero, "Előleg-díjbekérő",
        l.dijbekero ? `${esc(l.dijbekero.szam)} · ${esc(l.dijbekero.allapot)}` : "következő lépés")}
      ${lepes(!!l.szamla && l.szamla.allapot !== "küldésre vár",
        !!l.dijbekero && l.dijbekero.allapot === "fizetve" && !l.szamla, "Végszámla",

/* A végszámla jóváhagyó lapja. A díjbekérőhöz hasonlóan: egy képernyő, egy

/* Egy korábban kiadott ajánlat újranyitása: azt mutatjuk meg, amit az
   ügyfél kapott, nem a belső jóváhagyó lapot. */
function ajanlatMegnyit(szam){
  const rec = ajanlatok.find(x => x.szam === szam);
  if(!rec) return;
  // A pillanatkép az igazság; újraszámolni csak akkor szabad, ha nincs
  // (régi tárolt állapot) — és akkor sem szabad összeomlani.
  let a = rec.pillanatkep;
  if(!a){
    try{ a = ajanlatKeszites(rec.partner, rec.m2, rec.valtozat); }
    catch(e){ pirit(e.message); return; }
  }
  nezettAjanlat = { a, szam:rec.szam, allapot:rec.allapot, kelt:rec.kelt };
  lapNyit(dokumentumLap());
}

];

/* A kiolvasás eredményének munkapéldánya. A KIOLVASOTT a kiindulás; ez az,
   amit a felhasználó javíthat — és a javítás nyoma is látszik. */
let kiolvasott = [];
let fotoUrl = null;

function szamlaLapNyit(){
  lapNyit(`
    <div class="lap-fej"><button class="ikongomb" data-zar aria-label="Vissza">←</button><h2>Számla rögzítése</h2></div>
    <div class="lap-torzs">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <circle cx="12" cy="13" r="3.5"></circle>

  if(be) be.addEventListener("change", () => {
    // Ha tényleg fotózott, azt mutatjuk meg — nem egy illusztrációt.
    const f = be.files && be.files[0];
    if(fotoUrl){ URL.revokeObjectURL(fotoUrl); fotoUrl = null; }
    if(f) fotoUrl = URL.createObjectURL(f);
    szamlaKiolvasas();
  });

  // a fotó nélküli demó-út külön gomb.
  document.querySelector("#lap [data-demofoto]")?.addEventListener("click", () => {

}

function szamlaKiolvasas(){
  kiolvasott = KIOLVASOTT.map(m => ({ ...m }));
  lapNyit(`
    <div class="lap-fej"><button class="ikongomb" data-zar aria-label="Vissza">←</button><h2>Olvasom…</h2></div>

      <div class="ures">Kiolvasom a számla adatait…</div>
    </div>`);
  setTimeout(szamlaMegerosites, 900);
}

/* Az 5. sarkalatos szabály másik fele: a javítás legyen egy koppintás.
   Ami javítva lett, azon az látszik, hogy már a vállalkozó mondta ki. */
function mezoJavit(kulcs){
  const m = kiolvasott.find(x => x.kulcs === kulcs);
  if(!m) return;
  urlapLap({
    cim:m.nev,
    leiras:`Ezt innen olvastam ki: ${esc(m.honnan)}. Ha nem stimmel, írd át — a te értéked lesz az igaz.`,
    mezok:[{ kulcs:"ertek", nev:m.nev, ertek:m.ertek }],
    mentesCimke:"Ez a helyes érték",
    megse: () => szamlaMegerosites(),
    onMentes:(k) => {
      if(!k.ertek){ pirit("Üresen nem hagyhatod"); return; }
      const regi = m.ertek;
      m.ertek = k.ertek; m.biztos = true; m.javitott = true;
      m.honnan = "te javítottad";
      naplo.unshift({ ido:"08:21", mit:"Kiolvasott mező javítása",
        reszlet:`${m.nev}: „${regi}" → „${k.ertek}"`, allapot:"kész" });
      szamlaMegerosites();
      pirit("Javítva");
    },
  });
}

function szamlaMegerosites(){
  if(!kiolvasott.length) kiolvasott = KIOLVASOTT.map(m => ({ ...m }));
  const bizonytalan = kiolvasott.filter(m => !m.biztos);
  lapNyit(`
    <div class="lap-fej"><button class="ikongomb" data-zar aria-label="Vissza">←</button><h2>Ellenőrizd</h2></div>
    <div class="lap-torzs">
      ${fotoUrl ? `<img class="fotokep" src="${fotoUrl}" alt="A lefotózott számla">` : ""}
      ${bizonytalan.length ? `
      <div class="feltetel">
        <div class="cim">${bizonytalan.length} mezőben nem vagyok biztos</div>
        <ul>${bizonytalan.map(m => `<li>${esc(m.nev)} — ${esc(m.honnan)}</li>`).join("")}</ul>
      </div>` : ""}
      <div class="mezok">
        ${kiolvasott.map(m => `
          <button class="mezo ${m.javitott ? "javitott" : (m.biztos ? "" : "ellenorizd")}" data-mezo="${m.kulcs}">
            <span class="bal">
              <span class="nev">${esc(m.nev)}</span>
              <span class="ert">${esc(m.ertek)}</span>
              <span class="honnan">${esc(m.honnan)}</span>
            </span>
            <span class="ceruza">JAVÍT</span>
          </button>`).join("")}
      </div>
      <p style="margin:0; font-size:.85rem; color:var(--muted)">
        Minden adat mellett ott van, honnan olvastam ki. Koppints rá, ha javítani kell.
      </p>
    </div>
    <div class="lap-lab">
      <button class="gomb fo" data-tett="szamla-rogzit">Rendben, rögzítsd</button>
      <button class="gomb veszelyes" data-zar>Eldobom</button>
    </div>`);
  document.querySelectorAll("#lap [data-mezo]").forEach(b =>
    b.addEventListener("click", () => mezoJavit(b.dataset.mezo)));
}

/* Offline sor: a művelet elkészül, csak a kiküldés vár a térerőre. */
function sorbaTesz(mit, ajanlatSzam, lancTipus){
  sor.push({ mit, ido:"08:20", ajanlatSzam, lancTipus });
  naplo.unshift({ ido:"08:20", mit, reszlet:"nincs térerő — sorba állítva", allapot:"küldésre vár" });
  ment();
}

/* A sor kiürítése, amikor visszajön a kapcsolat — akár a szimulációs
   kapcsolóval, akár a valódi böngészőeseménnyel. A „küldésre vár" ajánlatok
   itt válnak tényleg kiküldötté. */
function sorKuldes(){
  if(!online() || !sor.length) return 0;
  const db = sor.length;
  sor.forEach(x => {
    naplo.unshift({ ido:"08:24", mit:x.mit, reszlet:"a sorból elküldve", allapot:"végrehajtva" });
    const aj = x.ajanlatSzam ? ajanlatok.find(y => y.szam === x.ajanlatSzam) : null;
    if(aj && !x.lancTipus && aj.allapot === "küldésre vár") aj.allapot = "kiküldve";
    // A pénzügyi lánc lépései is csak most válnak ténylegesen kiállítottá.
    if(aj && aj.lanc && x.lancTipus === "dijbekero" && aj.lanc.dijbekero){
      aj.lanc.dijbekero.allapot = "kiállítva";
    }
    if(aj && aj.lanc && x.lancTipus === "vegszamla" && aj.lanc.szamla){
      aj.lanc.szamla.allapot = "kiállítva";
      if(!szamlak.some(sz => sz.szam === aj.lanc.szamla.szam)){
        szamlak.push({ szam:aj.lanc.szamla.szam, partner:aj.partner, brutto:aj.lanc.szamla.osszeg,
          hatarido: plusNap(aj.lanc.szamla.kelt, ceg.fizetesiHatarido), allapot:"nyitott" });
      }
    }
  });
  sor = [];
  ment();
  pirit(`${db} művelet elküldve`);
  return db;
}

/* ==========================================================================
   Végigvezetés — „Intézd el a mai sürgős dolgaimat".
   Ez mutatja meg a jóváhagyási kaput a legtisztábban: a rendszer összeszedi
   és sorba rakja az ügyeket, majd tételenként megáll. Minden tétel három
   állapotot vehet fel: javasolt → jóváhagyott / kihagyott → végrehajtott.
   Semmi nem történik meg magától.
   (A 16. modul az ütemtervben V2 — ez itt csak bemutató, nem fejlesztés.)
   ========================================================================== */
let ugyek = [];
let ugyIdx = 0;
/* Az utolsó ajánlat paraméterei — a „Módosítom" ág ebből számol újra. */
let utolsoAjanlat = null;
let modositastVar = false;

function ugyekOsszeszedese(){
  const lista = [];
  for(const sz of lejartak()){
    lista.push({
      cim:`${P(sz.partner).nev} — fizetési emlékeztető`,
      miert:`${sz.szam} · ${Ft(sz.brutto)} · ${napok(MA, new Date(sz.hatarido))} napja lejárt`,
      javaslat:`Küldök egy udvarias emlékeztetőt ${esc(P(sz.partner).kapcsolat)} részére.`,
      sulyossag: napok(MA, new Date(sz.hatarido)) > 14 ? "kritikus" : "figyelem",
      allapot:"javasolt",
    });
  }
  // Az utánkövetés nem külön beírt szöveg: abból jön, ami tényleg kiment.
  for(const aj of ajanlatok.filter(x => x.allapot === "nincs válasz")){
    lista.push({
      cim:`${P(aj.partner).nev} — ajánlat utánkövetése`,
      miert:`${aj.szam} · ${Ft(aj.brutto)} · ${napok(MA, new Date(aj.kelt))} napja kiküldve, nincs válasz`,
      javaslat:"Írok egy rövid érdeklődő levelet, és beteszek egy visszahívást péntekre.",
      sulyossag:"figyelem",
      allapot:"javasolt",
    });
  }
  // Sorrend: ami régebb óta áll és nagyobb, az megy előre.
  return lista.sort((a,b) => (a.sulyossag === "kritikus" ? -1 : 1) - (b.sulyossag === "kritikus" ? -1 : 1));
}

function ugyLap(){
  if(ugyIdx >= ugyek.length) return ugyZaras();
  const u = ugyek[ugyIdx];
  lapNyit(`
    <div class="lap-fej">
      <button class="ikongomb" data-tett="ugy-leallit" aria-label="Leállítom">←</button>
      <h2>${ugyIdx + 1} / ${ugyek.length}</h2>
      <span class="jelzes ${u.sulyossag === "kritikus" ? "j-kritikus" : "j-figyelem"}">${u.sulyossag === "kritikus" ? "sürgős" : "fontos"}</span>
    </div>
    <div class="lap-torzs">
      <div class="cimsor"><h1>${esc(u.cim)}</h1></div>
      <div class="sor" style="cursor:default">
        <div class="fo"><div class="alatta">${esc(u.miert)}</div></div>
      </div>
      <div class="valasz">
        <p>${u.javaslat}</p>
        <span class="reteg varakozo">javasolt — még nem történt meg</span>
      </div>
      <p style="margin:0; font-size:.88rem; color:var(--muted)">
        ${ugyek.length - ugyIdx - 1 > 0
          ? `Utána még ${ugyek.length - ugyIdx - 1} ügy van.`
          : "Ez az utolsó."}
      </p>
    </div>
    <div class="lap-lab">
      <button class="gomb fo" data-tett="ugy-jovahagy">Jóváhagyom</button>
      <div class="gombsor ketto">
        <button class="gomb" data-tett="ugy-kihagy">Kihagyom</button>
        <button class="gomb veszelyes" data-tett="ugy-leallit">Leállítom</button>
      </div>
    </div>`);
}

function ugyZaras(){
  const kesz = ugyek.filter(u => u.allapot === "végrehajtott").length;
  const kihagyott = ugyek.filter(u => u.allapot === "kihagyott").length;
  ment();
  lapZar();
  valasz = { reteg:0,
    szoveg: kesz
      ? `Végeztem: <span class="kiemel">${kesz} ügyet</span> elintéztem${kihagyott ? `, ${kihagyott} kimaradt` : ""}. Mind bekerült az AI naplóba.`
      : "Rendben, nem küldtem ki semmit. Az ügyek maradtak, ahogy voltak." };
  nezet = "ma"; rajzol();
  if(kesz) pirit(`${kesz} ügy elintézve`);
}

function tett(mit){
  if(mit === "ajanlat-dokumentum"){ lapNyit(dokumentumLap()); return; }
  if(mit === "ajanlat-anyag"){ lapNyit(anyagLap()); return; }
  if(mit === "ajanlat-vissza"){
    if(nezettAjanlat && nezettAjanlat.allapot === "tervezet"){
      lapNyit(ajanlatLap(nezettAjanlat.a, nezettAjanlat.szam, nezettAjanlat.allapot, nezettAjanlat.kelt));
    } else { lapZar(); }
    return;
  }
  if(mit === "nyomtat"){
    // A böngésző nyomtatási párbeszéde ad PDF-et. Ha a beágyazás tiltja,
    // ne dobjon hibát a demó közepén.
    try { window.print(); } catch(_) { pirit("A nyomtatás itt nincs engedélyezve"); }
    return;
  }
  if(mit === "anyag-rendeles"){
    const { a } = nezettAjanlat;
    const mennyi = anyagszukseglet(a.m2, a.fm, a.valtozat);
    const cim = `Beszerzési lista — ${P(nagyker.szallito).nev} (${new Intl.NumberFormat("hu-HU").format(a.m2)} m²)`;
    lapZar();
    if(online()){
      naplo.unshift({ ido:"08:26", mit:"Beszerzési lista kiküldése",
        reszlet:`${cim} · ${mennyi.length} tétel · jóváhagyva, elküldve`, allapot:"végrehajtva" });
      valasz = { reteg:0, szoveg:`Elküldtem a beszerzési listát a <span class="kiemel">${esc(P(nagyker.szallito).nev)}</span> részére, ${mennyi.length} tétellel. Szólok, ha visszaigazolják.` };
      pirit("Beszerzési lista elküldve");
      ment();
    } else {
      sorbaTesz(cim);
      valasz = { reteg:0, szoveg:"Most nincs térerő, ezért <span class=\"kiemel\">sorba tettem</span> a beszerzési listát — elküldöm, amint van." };
      pirit("Sorba állítva");
    }
    nezet = "ma"; rajzol(); return;
  }
  if(mit === "dijbekero-elokeszit"){ dijbekeroLap(); return; }
  if(mit === "vegszamla-elokeszit"){ vegszamlaLap(); return; }
  if(mit === "dijbekero-vissza"){
    // Az elvetett kiállításnak is legyen nyoma — az állapotgépben van
    // „elvetett" mellékág, a végigvezetés kihagyása is naplózódik.
    const rec = nezettAjanlat && ajanlatok.find(x => x.szam === nezettAjanlat.szam);
    const lap = document.querySelector("#lap h2");
    if(rec && lap && /Díjbekérő|Végszámla/.test(lap.textContent)){
      naplo.unshift({ ido:"08:39", mit:`${lap.textContent} — elvetve`,
        reszlet:`${P(rec.partner).nev} · ${rec.szam} · a kiállítás nem történt meg`,
        allapot:"elvetett" });
      ment();
    }
    lapNyit(dokumentumLap()); return;
  }
  if(mit === "dijbekero-kiallit"){
    const rec = nezettAjanlat && ajanlatok.find(x => x.szam === nezettAjanlat.szam);
    if(!rec) return;
    const osszeg = Math.round(rec.brutto * 0.4);
    dijbekeroSzamlalo += 1;
    const szam = `DB-2026/0${dijbekeroSzamlalo}`;
    rec.lanc = rec.lanc || {};
    // Térerő nélkül a kiállítás nem történhetett meg: sorba kerül, és a
    // felület sem mondhatja kiállítottnak. Ugyanaz a minta, mint mindenütt.
    const kikuldve = online();
    rec.lanc.dijbekero = { szam, osszeg, kelt:"2026-08-25",
      allapot: kikuldve ? "kiállítva" : "küldésre vár" };
    if(kikuldve){
      naplo.unshift({ ido:"08:38", mit:"Előleg-díjbekérő kiállítása",
        reszlet:`${P(rec.partner).nev} · ${rec.szam} → ${szam} · ${Ft(osszeg)} · Billingo (szimulált) · jóváhagyva, kiküldve`,
        allapot:"végrehajtva" });
      pirit("Díjbekérő kiállítva");
    } else {
      sorbaTesz(`Díjbekérő kiállítása — ${P(rec.partner).nev} (${szam})`, rec.szam, "dijbekero");
      pirit("Sorba állítva");
    }
    ment(); rajzol(); lapNyit(dokumentumLap());
    return;
  }
  if(mit === "dijbekero-fizetve"){
    const rec = nezettAjanlat && ajanlatok.find(x => x.szam === nezettAjanlat.szam);
    if(!rec || !rec.lanc || !rec.lanc.dijbekero) return;
    rec.lanc.dijbekero.allapot = "fizetve";
    naplo.unshift({ ido:"08:40", mit:"Előleg beérkezett",
      reszlet:`${rec.lanc.dijbekero.szam} · ${P(rec.partner).nev} · ${Ft(rec.lanc.dijbekero.osszeg)}`,
      allapot:"kész" });
    ment(); rajzol(); lapNyit(dokumentumLap()); pirit("Előleg beérkezett");
    return;
  }
  if(mit === "vegszamla-kiallit"){
    const rec = nezettAjanlat && ajanlatok.find(x => x.szam === nezettAjanlat.szam);
    // A kapu a „fizetve" állapotot nézi, nem csak a díjbekérő létét.
    if(!rec || !rec.lanc || !rec.lanc.dijbekero || rec.lanc.dijbekero.allapot !== "fizetve") return;
    const hatra = rec.brutto - rec.lanc.dijbekero.osszeg;
    szamlaSzamlalo += 1;
    const szam = `SZ-2026/0${szamlaSzamlalo}`;
    const hatarido = plusNap("2026-08-25", ceg.fizetesiHatarido);
    const kikuldve = online();
    rec.lanc.szamla = { szam, osszeg:hatra, kelt:"2026-08-25",
      allapot: kikuldve ? "kiállítva" : "küldésre vár" };
    if(kikuldve){
      // A kiállított számla a kintlévőségek közé kerül — különben a demó
      // kiállít valamit, ami utána sehol nem létezik.
      szamlak.push({ szam, partner:rec.partner, brutto:hatra, hatarido, allapot:"nyitott" });
      naplo.unshift({ ido:"08:41", mit:"Végszámla kiállítása a díjbekérőből",
        reszlet:`${rec.lanc.dijbekero.szam} → ${szam} · ${Ft(hatra)} · Billingo create-from-proforma (szimulált) · jóváhagyva, kiküldve`,
        allapot:"végrehajtva" });
      pirit("Végszámla kiállítva");
    } else {
      sorbaTesz(`Végszámla kiállítása — ${P(rec.partner).nev} (${szam})`, rec.szam, "vegszamla");
      pirit("Sorba állítva");
    }
    ment(); rajzol(); lapNyit(dokumentumLap());
    return;
  }
  if(mit.startsWith("munka-allapot:") || mit.startsWith("munka-vissza:")){
    const elore = mit.startsWith("munka-allapot:");
    const m = munkak.find(x => x.id === mit.slice(mit.indexOf(":") + 1));
    if(!m) return;
    const cel = MUNKA_ALLAPOTOK[MUNKA_ALLAPOTOK.indexOf(m.allapot) + (elore ? 1 : -1)];
    if(!cel) return;
    const regi = m.allapot;
    m.allapot = cel;
    naplo.unshift({ ido:"08:36", mit:"Munka állapotának átállítása",
      reszlet:`${m.nev} · ${regi} → ${cel}${elore ? "" : " (visszaléptetve)"}`, allapot:"kész" });
    // A háttérben lévő lista és a Ma-képernyő is elavul, ha nem rajzoljuk újra.
    ment(); rajzol(); munkaLap(m.id); pirit(`Munka: ${cel}`);
    return;
  }
  if(mit === "arfrissites-atvezet" || mit === "arfrissites-csakbesz"){
    if(!arfrissites) return;
    const teljes = mit === "arfrissites-atvezet";
    const reszletek = [];
    for(const v of arfrissites.valtozasok){
      const nk = nagyker.tetelek.find(x => x.nev === v.nev);
      const sajat = arlista.find(x => x.nev === v.nev);
      let sor = `${v.nev}: ${nk ? nk.besz : "?"} → ${v.uj}`;
      if(sajat && sajat.besz > 0){
        if(teljes){
          const ujAr = Math.round(v.uj * sajat.ar / sajat.besz / 10) * 10;
          sor += ` (eladási ${sajat.ar} → ${ujAr})`;
          sajat.ar = ujAr;
        }
        sajat.besz = v.uj;
      }
      if(nk) nk.besz = v.uj;
      reszletek.push(sor);
    }
    nagyker.frissitve = arfrissites.kelt;
    // Tételes napló, régi → új értékekkel — ugyanúgy, ahogy a kézi
    // ármódosítás is tételesen naplóz.
    naplo.unshift({ ido:"08:28", mit:"Nagyker árfrissítés átvezetése",
      reszlet:`${P(nagyker.szallito).nev} · ${teljes ? "az árrés tartásával" : "csak beszerzési árak"} · jóváhagyva · ${reszletek.join(" · ")}`,
      allapot:"végrehajtva" });
    arfrissites = null;
    ment(); lapZar();
    valasz = { reteg:0, szoveg: teljes
      ? `Átvezettem <span class="kiemel">${reszletek.length} tétel</span> új beszerzési árát, és az eladási árakat az árrésed tartásával. A következő ajánlat már ezekkel számol.`
      : `Átvezettem a beszerzési árakat, az eladási áraid maradtak. Ahol a nagyker drágult, ott az árrésed szűkült; ahol olcsóbb lett, ott nőtt. Az ajánlataid összege nem változott.` };
    nezet = "nagyker"; rajzol(); pirit("Árak átvezetve");
    return;
  }
  if(mit === "ugy-jovahagy"){
    const u = ugyek[ugyIdx];
    u.allapot = online() ? "végrehajtott" : "küldésre vár";
    if(online()){
      naplo.unshift({ ido:"08:3" + ugyIdx, mit:u.cim, reszlet:"jóváhagyva, végrehajtva", allapot:"végrehajtva" });
    } else {
      sorbaTesz(u.cim);
      u.allapot = "végrehajtott"; // a felhasználó szempontjából elintézett, csak a küldés vár
    }
    ugyIdx += 1; ugyLap(); return;
  }
  if(mit === "ugy-kihagy"){
    const u = ugyek[ugyIdx];
    u.allapot = "kihagyott";
    naplo.unshift({ ido:"08:3" + ugyIdx, mit:u.cim, reszlet:"a felhasználó kihagyta", allapot:"kihagyott" });
    ugyIdx += 1; ugyLap(); return;
  }
  if(mit === "ugy-leallit"){ ugyZaras(); return; }

  if(mit === "ajanlat-jovahagy"){
    const { a, szam } = nezettAjanlat;
    // A kiadott sorszám itt dől el, nem korábban: ami nem ment ki, annak
    // nincs sorszáma. Offline a lista is „küldésre vár"-t mond — nem
    // hazudhatja kiküldöttnek, amit még nem küldtünk el.
    const allapot = online() ? "kiküldve" : "küldésre vár";
    ajanlatSzamlalo += 1;
    ajanlatok.unshift({ szam, partner:a.partner.id, m2:a.m2, valtozat:a.valtozat,
      kelt:"2026-08-25", brutto:a.brutto, allapot, pillanatkep:a });
    nezettAjanlat.allapot = allapot;
    feladatok.push({ cim:`${a.partner.nev} — ajánlat utánkövetése`, hatarido:"2026-08-31", surgos:false });
    lapZar();
    if(!online()){
      sorbaTesz(`Ajánlat kiküldése — ${a.partner.nev}`, szam);
      valasz = { szoveg:"Jóváhagyva. Most nincs térerő, ezért <span class=\"kiemel\">sorba tettem</span> — elküldöm, amint van. Az utánkövetést felvettem.", reteg:0 };
      pirit("Sorba állítva");
    } else {
      naplo.unshift({ ido:"08:14", mit:"Ajánlat kiküldése", reszlet:`${a.partner.nev} · jóváhagyva, kiküldve`, allapot:"végrehajtva" });
      valasz = { szoveg:"Kiküldtem az ajánlatot, és felvettem egy utánkövetési feladatot <span class=\"kiemel\">jövő hétfőre</span>.", reteg:0 };
      pirit("Ajánlat kiküldve");
    }
    ment();
    nezet = "ma"; rajzol();
  }
  if(mit === "szamla-rogzit"){
    // Amit rögzítünk, az a jóváhagyott — a javított — érték, nem a nyers kiolvasás.
    const mez = k => (kiolvasott.find(x => x.kulcs === k) || {}).ertek || "";
    const szamra = sz => Number(String(sz).replace(/[^\d]/g, "")) || 0;
    const brutto = szamra(mez("brutto"));
    const hatarido = (mez("hatarido").match(/\d{4}/) ? mez("hatarido").replace(/\D+/g, "-").replace(/-$/, "") : "2026-09-07");
    const javitott = kiolvasott.filter(x => x.javitott).length;
    // A kiállító a jóváhagyott érték — ha ismerős partner, hozzákötjük,
    // ha nem, a nevén rögzítjük. Nem írjuk felül azzal, amit mi hittünk.
    const kiallito = mez("kiallito");
    const talalt = partnerek.find(x => norm(x.nev) === norm(kiallito)
      || norm(kiallito).includes(norm(x.nev).split(/\s+/)[0]));
    bejovoSzamlak.unshift({ szam:mez("szamlaszam") || "BM-2026/0294",
      partner: talalt ? talalt.id : null, partnerNev: kiallito,
      brutto, hatarido, forras: javitott ? "fotó · javítva" : "fotó" });
    naplo.unshift({ ido:"08:22", mit:"Bejövő számla rögzítése",
      reszlet:`${mez("kiallito")} · ${Ft(brutto)}${javitott ? ` · ${javitott} mezőt te javítottál` : " · 1 mezőt megjelöltem ellenőrzésre"}`,
      allapot:"jóváhagyva" });
    ment(); lapZar();
    valasz = { szoveg:`Rögzítettem a <span class="kiemel">${esc(mez("kiallito"))}</span> számláját, ${Ft(brutto)}, fizetési határidő ${esc(mez("hatarido"))} Beteszem a fizetendők közé.`, reteg:0 };
    nezet = "ma"; rajzol(); pirit("Számla rögzítve");
  }
  if(mit === "ajanlat-modosit"){
    lapZar();
    modositastVar = true;
    valasz = { reteg:0, szoveg:'Mit módosítsak? Mondj egy új méretet — például <span class="kiemel">„kilencszáz négyzetméter"</span> —, vagy azt, hogy <span class="kiemel">antik térkővel</span>.' };
    nezet = "ma"; rajzol();
  }
  if(mit === "felszolitas-jovahagy"){
    naplo.unshift({ ido:"08:16", mit:"Fizetési felszólítás", reszlet:"jóváhagyva, kiküldve", allapot:"végrehajtva" });
    ment();
    lapZar(); pirit("Felszólítás kiküldve");
    valasz = { szoveg:"Elküldtem a felszólítást. Ha egy héten belül nem fizet, szóljak?", reteg:0 };
    rajzol();
  }
}

function pirit(szoveg){
  const el = document.createElement("div");
  el.className = "pirit"; el.textContent = szoveg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

   ========================================================================== */
function kezel(szoveg, hangbol){
  const hallottam = hangbol ? szoveg : null;
  const r = reteg0(szoveg);

  // Ajánlat módosítása: rövid válasz egy folyamatban lévő kérdésre.
  // Nem kell hozzá teljes parancs, elég a megváltozott adat. De ha a mondat
  // önmagában is teljes parancs („készíts ajánlatot a Szabónak 300..."),
  // az megy a szokásos úton — nem az előző ajánlatot írjuk át vele.
  if(modositastVar && utolsoAjanlat && !r){
    const ujM2 = szamKinyeres(szoveg);
    const ujValtozat = /antik/.test(norm(szoveg)) ? "antik"
      : /(szurke|normal)/.test(norm(szoveg)) ? "normal" : null;
    if(ujM2 || ujValtozat){
      modositastVar = false;
      utolsoAjanlat = {
        partner: utolsoAjanlat.partner,
        m2: ujM2 || utolsoAjanlat.m2,
        valtozat: ujValtozat || utolsoAjanlat.valtozat,
      };
      let aj;
      try{ aj = ajanlatKeszites(utolsoAjanlat.partner, utolsoAjanlat.m2, utolsoAjanlat.valtozat); }
      catch(e){
        valasz = { hallottam, reteg:0, szoveg:esc(e.message) };
        nezet = "arlista"; rajzol(); return;
      }
      naplo.unshift({ ido:"08:13", mit:"Ajánlat módosítása", parancs:szoveg,
        reszlet:`${aj.partner.nev} · ${utolsoAjanlat.m2} m²${utolsoAjanlat.valtozat === "antik" ? " · antik" : ""} · ${Ft(aj.brutto)}`,
        allapot:"jóváhagyásra vár" });
      valasz = { hallottam, reteg:0,
        szoveg:`Átszámoltam: ${new Intl.NumberFormat("hu-HU").format(utolsoAjanlat.m2)} m²${utolsoAjanlat.valtozat === "antik" ? ", antik térkővel" : ""}. Az új végösszeg <span class="kiemel">${Ft(aj.brutto)}</span>.` };
      nezet = "ma"; rajzol();
      lapNyit(ajanlatLap(aj));
      return;
    }
    modositastVar = false; // nem módosítás volt — menjen a szokásos úton
  }
  modositastVar = false; // teljes parancs érkezett — a módosítás-várakozás lejárt

  if(!r){
    // Ide kerülne az 1. réteg hívása (olcsó modell, zárt sémával).
    valasz = {
      hallottam,
      szoveg:"Ezt nem ismertem fel helyben, ezért továbbadnám a modellnek. A prototípusban nincs modellhívás — próbáld a lenti javaslatok valamelyikét.",
      reteg:1
    };
    nezet = "ma"; rajzol(); return;
  }

  if(r.hianyzik.length){
    const kerdes = {
      partner:"Melyik partnernek?",
      mennyiseg:"Hány négyzetméterre?",
      hatarido:"Mikorra tegyem be?"
    }[r.hianyzik[0]];
    valasz = { hallottam, szoveg:esc(kerdes) + " Mondd egy szóval.", reteg:0 };
    nezet = "ma"; rajzol(); return;
  }

  const a = r.adatok;
  switch(r.szandek){
    case "ajanlat": {
      const valtozat = /antik/.test(norm(szoveg)) ? "antik" : "normal";
      let aj;
      try{ aj = ajanlatKeszites(a.partner, a.mennyiseg, valtozat); }
      catch(e){
        valasz = { hallottam, reteg:0, szoveg:esc(e.message) };
        nezet = "arlista"; rajzol(); return;
      }
      utolsoAjanlat = { partner:a.partner, m2:a.mennyiseg, valtozat };
      naplo.unshift({ ido:"08:12", mit:"Ajánlat készítése", parancs:szoveg,
        reszlet:`${aj.partner.nev} · ${a.mennyiseg} m² · ${Ft(aj.brutto)}`, allapot:"jóváhagyásra vár" });
      valasz = { hallottam, reteg:0,
        szoveg:`Elkészítettem az ajánlatot <span class="kiemel">${esc(aj.partner.nev)}</span> részére, ${new Intl.NumberFormat("hu-HU").format(a.mennyiseg)} m²-re. Végösszeg <span class="kiemel">${Ft(aj.brutto)}</span>.` };
      nezet = "ma"; rajzol();
      lapNyit(ajanlatLap(aj));
      return;
    }
    case "lejart": {
      const lej = lejartak();
      valasz = { hallottam, reteg:0,
        szoveg:`<span class="kiemel">${Ft(lej.reduce((s,x)=>s+x.brutto,0))}</span> lejárt követelésed van ${lej.length} számlán. A legrégebbi ${napok(MA, new Date(lej[lej.length-1].hatarido))} napja.` };
      nezet = "penzugy"; rajzol(); return;
    }
    case "fizetendo":
      valasz = { hallottam, reteg:0, szoveg:"Ezen a héten <span class=\"kiemel\">2 656 000 Ft</span> kifizetés esedékes 2 bejövő számlán." };
      nezet = "penzugy"; rajzol(); return;
    case "felszolitas": {
      const p = P(a.partner);
      naplo.unshift({ ido:"08:15", mit:"Fizetési felszólítás", reszlet:`${p.nev} · levéltervezet`, allapot:"jóváhagyásra vár" });
      lapNyit(`

      valasz = { hallottam, reteg:0, szoveg:`Megírtam a levelet a <span class="kiemel">${esc(p.nev)}</span> részére. Kiküldés előtt jóváhagyást kérek.` };

    }
    case "agent": {
      ugyek = ugyekOsszeszedese(); ugyIdx = 0;
      naplo.unshift({ ido:"08:30", mit:"Napi ügyek összeszedése",
        reszlet:`${ugyek.length} tétel, fontossági sorrendben`, allapot:"javaslat" });
      valasz = { hallottam, reteg:0,
        szoveg:`Összeszedtem a mai ügyeket: <span class="kiemel">${ugyek.length} tétel</span>, fontossági sorrendben. Egyenként végigmegyünk rajtuk — semmit nem küldök ki jóváhagyás nélkül.` };
      nezet = "ma"; rajzol();
      setTimeout(ugyLap, 700);
      return;
    }
    case "szamla_rogzites":
      valasz = { hallottam, reteg:0, szoveg:"Rendben, fotózd le a számlát. Kiolvasom, te ellenőrzöd." };
      nezet = "ma"; rajzol(); szamlaLapNyit(); return;
    case "arlista":
      valasz = { hallottam, reteg:0, szoveg:"Itt az árlistád. A szürke térkő anyagára <span class=\"kiemel\">3 950 Ft/m²</span>." };
      nezet = "arlista"; rajzol(); return;
    case "ajanlatok": {
      const fuggo = ajanlatok.filter(x => ["nincs válasz","kiküldve","küldésre vár"].includes(x.allapot));
      valasz = { hallottam, reteg:0,
        szoveg:`${ajanlatok.length} ajánlatod van nyilvántartva, ebből <span class="kiemel">${fuggo.length}</span> vár válaszra, összesen ${Ft(fuggo.reduce((s,x) => s + x.brutto, 0))} értékben.` };
      nezet = "ajanlatok"; rajzol(); return;
    }
    case "anyag": {
      // A méret jöhet a mondatból, vagy abból az ajánlatból, amit épp néztünk.
      const m2 = a.mennyiseg || (nezettAjanlat && nezettAjanlat.a.m2) || (utolsoAjanlat && utolsoAjanlat.m2);
      if(!m2){
        valasz = { hallottam, reteg:0, szoveg:"Hány négyzetméterre? Mondd egy szóval." };
        nezet = "ma"; rajzol(); return;
      }
      const partnerId = a.partner || (utolsoAjanlat && utolsoAjanlat.partner) || "kovacs";
      const valtozat = /antik/.test(norm(szoveg)) ? "antik"
        : (utolsoAjanlat && utolsoAjanlat.m2 === m2 ? utolsoAjanlat.valtozat : "normal");
      let aj;
      try{ aj = ajanlatKeszites(partnerId, m2, valtozat); }
      catch(e){
        valasz = { hallottam, reteg:0, szoveg:esc(e.message) };
        nezet = "arlista"; rajzol(); return;
      }
      // „számítás", nem „tervezet": a Vissza így bezár, nem az ajánlat
      // jóváhagyó lapjára visz — nem ajánlatot kért, hanem mennyiséget.
      nezettAjanlat = { a:aj, szam:kovetkezoAjanlatSzam(), allapot:"számítás", kelt:"2026-08-25" };
      naplo.unshift({ ido:"08:25", mit:"Anyagszükséglet számítása", parancs:szoveg,
        reszlet:`${new Intl.NumberFormat("hu-HU").format(m2)} m² · determinisztikus számítás`, allapot:"kész" });
      valasz = { hallottam, reteg:0,
        szoveg:`Kiszámoltam, mit kell rendelni <span class="kiemel">${new Intl.NumberFormat("hu-HU").format(m2)} m²</span>-hez. A térkövön kívül az alapréteg és az ágyazat is benne van.` };
      nezet = "ma"; rajzol();
      lapNyit(anyagLap());
      return;
    }
    case "munkak": {
      const fut = munkak.filter(m => m.allapot === "folyamatban");
      valasz = { hallottam, reteg:0,
        szoveg:`${munkak.length} munkád van nyilvántartva, ebből <span class="kiemel">${fut.length} fut</span>${fut.length ? ` — a legközelebbi határidő: ${esc(fut[0].nev)}, ${datumHu(fut[0].hatarido)}` : ""}.` };
      nezet = "munkak"; rajzol(); return;
    }
    case "nagyker": {
      const dragult = arfrissites ? arfrissites.valtozasok.length : 0;
      valasz = { hallottam, reteg:0, szoveg: arfrissites
        ? `Új árlista érkezett a ${esc(P(nagyker.szallito).nev)} részéről (${datumHu(arfrissites.kelt)}) — <span class="kiemel">${dragult} tétel</span> vár átvezetésre. Nézd át, és te döntesz.`
        : `A nagyker árlista naprakész (frissítve: ${datumHu(nagyker.frissitve)}). A szürke térkövet <span class="kiemel">${Ft((nagyker.tetelek.find(x => /szurke/.test(norm(x.nev))) || {}).besz || 0)}</span>-ért veszed.` };
      nezet = "nagyker"; rajzol(); return;
    }
    case "cegprofil":
      valasz = { hallottam, reteg:0, szoveg:"Itt vannak a cégadataid és az alapértelmezések. Az ajánlat és a kiküldött dokumentum ezekből dolgozik." };
      nezet = "cegprofil"; rajzol(); return;
    case "teendo":
      valasz = { hallottam, reteg:0, szoveg:`Ma ${feladatok.length} teendőd van, ebből ${feladatok.filter(f=>f.surgos).length} sürgős.` };
      nezet = "feladatok"; rajzol(); return;
    default:
      valasz = { hallottam, reteg:0, szoveg:`Ma <span class="kiemel">${Ft(lejartak().reduce((s,x)=>s+x.brutto,0))}</span> lejárt követelésed van és ${feladatok.length} teendőd.` };
      nezet = "ma"; rajzol(); return;
  }
}

];

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mikro = document.getElementById("mikro");
const mikroCimke = document.getElementById("mikroCimke");
let felismero = null;

function figyelKezd(){
  if(!SR){ mikroCimke.innerHTML = "<b>Nincs mikrofon</b>Chrome kell hozzá, közvetlenül megnyitva"; return; }
  try{
    felismero = new SR();
    felismero.lang = "hu-HU";
    felismero.interimResults = false;
    felismero.onresult = e => { const t = e.results[0][0].transcript; kezel(t, true); };
    felismero.onerror = e => {
      mikroCimke.innerHTML = e.error === "not-allowed"
        ? "<b>A mikrofon tiltva</b>Beágyazva nem működik — nyisd meg közvetlenül"
        : "<b>Nem hallottam</b>Próbáld újra, vagy írd be";
      mikro.dataset.figyel = "0";
    };
    felismero.onend = () => { mikro.dataset.figyel = "0"; alaphelyzet(); };
    felismero.start();
    mikro.dataset.figyel = "1";
    mikroCimke.innerHTML = "<b>Hallgatlak…</b>engedd el, ha befejezted";
  }catch(_){
    mikroCimke.innerHTML = "<b>Nem indult el</b>Használd a szövegmezőt";
  }
}
function figyelVege(){ if(felismero){ try{ felismero.stop(); }catch(_){} } }
function alaphelyzet(){ setTimeout(() => { mikroCimke.innerHTML = "<b>Tartsd nyomva</b>és mondd, mit intézzek el"; }, 1200); }

/* Nyomva tartás, nem koppintás: zajban a folyamatos figyelés félreért. */
mikro.addEventListener("pointerdown", e => { e.preventDefault(); figyelKezd(); });
mikro.addEventListener("pointerup", figyelVege);
mikro.addEventListener("pointercancel", figyelVege);
mikro.addEventListener("pointerleave", figyelVege);
